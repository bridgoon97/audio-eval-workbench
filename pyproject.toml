[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-eval-workbench"
version = "0.8.1"
description = "听鉴：本地与局域网音频版本试听、标注和协作评测"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "numpy>=2.2,<3",
    "soundfile>=0.13,<1",
    "soxr>=1.1.0",
    "jsonschema>=4.26.0",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pyinstaller>=6,<7",
    "ruff>=0.16.6",
]

[project.scripts]
audio-eval = "workbench.cli:main"

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
